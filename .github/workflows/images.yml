name: Images

# Builds every image natively on amd64 and arm64 runners (no QEMU: the sandbox images are large), pushes them by
# digest to GHCR (and Docker Hub for releases), joins each pair into one multi-arch tag, and signs it with cosign (keyless).
# With `version` it tags X.Y.Z, X.Y, X and latest; on main it tags edge and sha-<commit>.
# Edge goes to GHCR only: every push to main would otherwise spend Docker Hub's pull/push rate limit.

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z); empty for an edge build
        type: string
        default: ""
      no-cache:
        description: Ignore the build cache and pull fresh base images
        type: boolean
        default: false
      sandboxRegistry:
        description: Docker Hub namespace for the sandbox images (zoo-sandbox-*); empty keeps them beside the platform images
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  DOCKERHUB: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'chann44' }}
  GHCR: ghcr.io/${{ github.repository_owner }}
  # the sandbox bucket's Docker Hub namespace; the platform bucket's when unset (GHCR stays shared)
  SANDBOX_DH: docker.io/${{ inputs.sandboxRegistry || vars.DOCKERHUB_NAMESPACE || 'chann44' }}

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, sandbox-desktop, sandbox-browser, sandbox-code, sandbox-code-slim, egress, gateway]
        arch: [amd64, arm64]
        include:
          - { image: api, context: ., file: docker/Dockerfile.api }
          - { image: web, context: apps/web, file: apps/web/Dockerfile }
          - { image: sandbox-desktop, context: ., file: docker/Dockerfile }
          - { image: sandbox-browser, context: ., file: docker/Dockerfile.browser }
          - { image: sandbox-code, context: ., file: docker/Dockerfile.code }
          - { image: sandbox-code-slim, context: ., file: docker/Dockerfile.code-slim }
          - { image: egress, context: ., file: docker/Dockerfile.egress }
          - { image: gateway, context: ., file: docker/Dockerfile.gateway }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        with:
          # base images through Google's Docker Hub mirror, so builds don't hit Docker Hub's pull rate limit
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: inputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # retried: the runner's connection to ghcr.io sometimes times out
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && exit 0
            echo "login attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,"name=${{ inputs.version != '' && format('{0}/zoo-{1},', startsWith(matrix.image, 'sandbox-') && env.SANDBOX_DH || env.DOCKERHUB, matrix.image) || '' }}${{ env.GHCR }}/zoo-${{ matrix.image }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version || 'edge' }}
          provenance: mode=max
          sbom: true
          pull: true
          no-cache: ${{ inputs.no-cache }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [api, web, sandbox-desktop, sandbox-browser, sandbox-code, sandbox-code-slim, egress, gateway]
    steps:
      # download by exact artifact name: a pattern glob like "digests-${{ matrix.image }}-*" would also match
      # digests-sandbox-code-slim-* for the sandbox-code job (and v4 treats pattern as one string: no newlines)
      - uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.image }}-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.image }}-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
        with:
          # base images through Google's Docker Hub mirror, so builds don't hit Docker Hub's pull rate limit
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: inputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # retried: the runner's connection to ghcr.io sometimes times out
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && exit 0
            echo "login attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ startsWith(matrix.image, 'sandbox-') && env.SANDBOX_DH || env.DOCKERHUB }}/zoo-${{ matrix.image }},enable=${{ inputs.version != '' }}
            ${{ env.GHCR }}/zoo-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,format=short,enable=${{ inputs.version == '' }}
      - uses: sigstore/cosign-installer@v3
      - name: Create multi-arch tags and sign them
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: zoo-${{ matrix.image }}
          RELEASE: ${{ inputs.version }}
        run: |
          # fail loudly rather than tag a partial or wrong-arch manifest list: exactly one digest per arch
          count=$(ls -1 | wc -l | tr -d ' ')
          [ "$count" = 2 ] || { echo "expected 2 digests (amd64+arm64), found $count:"; ls -1; exit 1; }
          dh="$DOCKERHUB"
          case "$IMAGE" in zoo-sandbox-*) dh="$SANDBOX_DH";; esac
          repos=("$GHCR/$IMAGE")
          if [ -n "$RELEASE" ]; then repos+=("$dh/$IMAGE"); fi
          for repo in "${repos[@]}"; do
            args=()
            while read -r tag; do
              [ -n "$tag" ] && args+=(-t "$tag")
            done < <(grep "^$repo:" <<< "$TAGS")
            # shellcheck disable=SC2046
            docker buildx imagetools create "${args[@]}" $(printf "$repo@sha256:%s " *)
            first=$(grep -m1 "^$repo:" <<< "$TAGS")
            digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
            cosign sign --yes "$repo@$digest"
            echo "$first -> $digest" >> "$GITHUB_STEP_SUMMARY"
          done
