name: SDKs

# Publishes the Python SDK (zoo-sdk on PyPI) on a sdk-py-v* tag and the TypeScript SDK (@zoo/sdk on npm) on a
# sdk-ts-v* tag. PyPI uses trusted publishing (configure the publisher for this repo and workflow on pypi.org);
# npm uses the NPM_TOKEN secret.

on:
  push:
    tags: ["sdk-py-v*", "sdk-ts-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    if: startsWith(github.ref, 'refs/tags/sdk-py-v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version' sdk/python/pyproject.toml | cut -d'"' -f2)
          test "sdk-py-v$version" = "${GITHUB_REF_NAME}"
      - run: uv build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  typescript:
    if: startsWith(github.ref, 'refs/tags/sdk-ts-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the version
        run: test "sdk-ts-v$(node -p "require('./sdk/typescript/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: bun install --frozen-lockfile && bun run build
        working-directory: sdk/typescript
      - run: npm publish --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
