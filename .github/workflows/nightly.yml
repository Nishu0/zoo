name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOO_VERSION: nightly
  JWT_SECRET: nightly-jwt-secret-that-is-long-enough-for-hs256
  ZOO_SECRETS_KEY: nightly-secrets-key

jobs:
  # Rebuild edge without the cache so it picks up patched base images and packages.
  edge:
    if: github.repository == 'chann44/zoo'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      no-cache: true
    secrets: inherit

  kata:
    name: End-to-end (Kata)
    # GitHub's standard Linux runners expose /dev/kvm; set ZOO_KVM_RUNNER to a self-hosted label if they stop doing so
    runs-on: ${{ vars.ZOO_KVM_RUNNER || 'ubuntu-24.04' }}
    env:
      ZOO_RUNTIME: kata
      ZOO_E2E_BOOT_TIMEOUT: "420"
    steps:
      - uses: actions/checkout@v5
      - name: Check for KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::this runner has no /dev/kvm, so Kata can't start VMs. Set the ZOO_KVM_RUNNER variable to a KVM runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install Kata Containers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/kata-containers/kata-containers/releases/latest \
            --jq '.assets[].browser_download_url | select(test("kata-static-.*-amd64\\.tar\\.(xz|zst)$"))' | head -n1)
          curl -fsSL "$url" -o "$RUNNER_TEMP/kata.tar"
          case "$url" in *.zst) sudo tar --zstd -xf "$RUNNER_TEMP/kata.tar" -C / ;; *) sudo tar -xJf "$RUNNER_TEMP/kata.tar" -C / ;; esac
          sudo ln -sf /opt/kata/bin/containerd-shim-kata-v2 /usr/local/bin/containerd-shim-kata-v2
          sudo python3 -c 'import json, os; p = "/etc/docker/daemon.json"; c = json.load(open(p)) if os.path.exists(p) else {}; c.setdefault("runtimes", {})["kata"] = {"runtimeType": "io.containerd.kata.v2"}; json.dump(c, open(p, "w"))'
          sudo systemctl restart docker
          docker run --rm --runtime kata alpine:3 uname -r
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
        with:
          # base images through Google's Docker Hub mirror, so builds don't hit Docker Hub's pull rate limit
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile.api
          load: true
          tags: docker.io/chann44/zoo-api:nightly
          cache-from: type=gha,scope=api-amd64
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: docker.io/chann44/zoo-web:nightly
          cache-from: type=gha,scope=web-amd64
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: docker.io/chann44/zoo-sandbox-desktop:nightly
          cache-from: type=gha,scope=sandbox-desktop-amd64
      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile.code
          load: true
          tags: docker.io/chann44/zoo-sandbox-code:nightly
          cache-from: type=gha,scope=sandbox-code-amd64
      - run: docker compose up -d
      - run: scripts/e2e.sh
      - if: failure()
        run: docker compose logs --tail 200

  kubernetes:
    name: Kubernetes driver (real cluster, Kata)
    # a cluster with Kata Containers installed (kata-deploy) on nodes with KVM; its kubeconfig in the
    # ZOO_NIGHTLY_KUBECONFIG secret. The driver's tests run in a namespace of their own, removed afterwards.
    runs-on: ubuntu-24.04
    steps:
      - name: Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.ZOO_NIGHTLY_KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::set the ZOO_NIGHTLY_KUBECONFIG secret to the kubeconfig of a cluster with Kata Containers"
            exit 1
          fi
          mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config && chmod 600 ~/.kube/config
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/kubernetes -v
        env:
          ZOO_TEST_KUBERNETES: zoo-nightly-${{ github.run_id }}
          ZOO_TEST_RUNTIME_CLASS: ${{ vars.ZOO_NIGHTLY_RUNTIME_CLASS || 'kata' }}
          # the edge code image: the cluster pulls it, and it has what the tests need (the zoo user, tar, curl)
          ZOO_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/zoo-sandbox-code:edge
          ZOO_TEST_DOCKER: ""

  vms:
    name: End-to-end (${{ matrix.platform }})
    # Off until the test servers exist: set ZOO_VM_E2E=true, plus per platform a POST /servers body in the
    # ZOO_E2E_<PLATFORM>_SERVER secret (e.g. {"name": "mac", "docker_url": "ssh://ci@mac.example", "bind_address":
    # "10.0.0.5", "platform": "macos"}) and the SSH key the API uses to reach it in ZOO_E2E_SSH_KEY.
    # ZOO_VM_E2E_RUNNER picks a runner that can reach the servers over SSH.
    if: vars.ZOO_VM_E2E == 'true'
    runs-on: ${{ vars.ZOO_VM_E2E_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, server: ZOO_E2E_MACOS_SERVER }
          - { platform: windows, server: ZOO_E2E_WINDOWS_SERVER }
    env:
      ZOO_RUNTIME: runc
      ZOO_SSH_DIR: ${{ github.workspace }}/.ci-ssh
      ZOO_E2E_KINDS: ${{ matrix.platform }}
      ZOO_E2E_BOOT_TIMEOUT: "900"
      ZOO_E2E_SERVER: ${{ secrets[matrix.server] }}
    steps:
      - uses: actions/checkout@v5
      - name: SSH key for the server
        env:
          KEY: ${{ secrets.ZOO_E2E_SSH_KEY }}
        run: |
          mkdir -p "$ZOO_SSH_DIR" && chmod 700 "$ZOO_SSH_DIR"
          printf '%s\n' "$KEY" > "$ZOO_SSH_DIR/id_ed25519" && chmod 600 "$ZOO_SSH_DIR/id_ed25519"
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' > "$ZOO_SSH_DIR/config"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
        with:
          # base images through Google's Docker Hub mirror, so builds don't hit Docker Hub's pull rate limit
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile.api
          load: true
          tags: docker.io/chann44/zoo-api:nightly
          cache-from: type=gha,scope=api-amd64
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: docker.io/chann44/zoo-web:nightly
          cache-from: type=gha,scope=web-amd64
      # the stack expects the Linux sandbox images even when only VM sandboxes are tested
      - run: |
          docker pull ghcr.io/chann44/zoo-sandbox-desktop:edge && docker tag ghcr.io/chann44/zoo-sandbox-desktop:edge docker.io/chann44/zoo-sandbox-desktop:nightly
          docker pull ghcr.io/chann44/zoo-sandbox-code:edge && docker tag ghcr.io/chann44/zoo-sandbox-code:edge docker.io/chann44/zoo-sandbox-code:nightly
      - run: docker compose up -d
      - run: scripts/e2e.sh
      - if: failure()
        run: docker compose logs --tail 200 api
