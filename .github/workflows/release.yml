name: Release

# Every push to main publishes edge and sha-<commit> images. release-please keeps a release PR open from the
# conventional commits on main; merging it tags vX.Y.Z, and this workflow then publishes the X.Y.Z images and
# attaches the install files to the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.created == 'true' && needs.release-please.outputs.version || '' }}
    secrets: inherit

  bundles:
    name: Offline bundle (${{ matrix.arch }})
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      ZOO_REGISTRY: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'chann44' }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - run: bash scripts/build-bundle.sh "$VERSION" dist "${{ matrix.arch }}"
      - run: gh release upload "$TAG" dist/zoo-bundle-* --clobber

  zoovm:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Signed with a Developer ID and notarized when these secrets exist: APPLE_DEVELOPER_ID_P12 (base64 of the
      # .p12) and APPLE_DEVELOPER_ID_PASSWORD, plus an App Store Connect API key for notarytool in
      # APPLE_NOTARY_KEY (the .p8's text), APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER. Without them the release
      # carries an ad-hoc signed build, which Gatekeeper blocks until `xattr -d com.apple.quarantine` is run on it.
      - name: Import the signing certificate
        id: sign
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::no APPLE_DEVELOPER_ID_P12 secret: zoovm is released ad-hoc signed and not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/zoovm.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::the .p12 holds no Developer ID Application identity"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - run: sh macos/zoovm/build.sh --no-install
        env:
          ZOOVM_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
      - name: Notarize
        if: steps.sign.outputs.identity != ''
        env:
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k macos/zoovm/.build/zoovm "$RUNNER_TEMP/zoovm.zip"
          # a bare binary can't be stapled; Gatekeeper looks its ticket up online on first run
          result=$(xcrun notarytool submit "$RUNNER_TEMP/zoovm.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --wait --timeout 30m --output-format json)
          echo "$result"
          echo "$result" | jq -e '.status == "Accepted"' >/dev/null || { echo "::error::notarization was not accepted"; exit 1; }
          codesign --verify --strict --verbose=2 macos/zoovm/.build/zoovm
      - run: tar -czf zoovm-macos-arm64.tar.gz -C macos/zoovm/.build zoovm
      - uses: actions/upload-artifact@v4
        with:
          name: zoovm
          path: zoovm-macos-arm64.tar.gz

  assets:
    name: Release assets
    needs: [release-please, images, zoovm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: zoovm
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/go.mod
          cache-dependency-path: guest/go.sum
      # install-node.ps1 -Iso builds it into the base Windows VM
      - name: Build zoo-guest for Windows
        working-directory: guest
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/zoo-guest-windows-amd64.exe .
      - name: Build release files
        run: |
          # compose.yml pinned to this release, pulling images instead of building them
          yq 'del(.services[].build)' compose.yml \
            | sed "s/\${ZOO_VERSION:-latest}/\${ZOO_VERSION:-$VERSION}/g" > dist/compose.yml
          grep -q "ZOO_VERSION:-$VERSION" dist/compose.yml
          # the Windows helpers on their own too: install-node.ps1 -Iso downloads them and zoo-guest, and checks them against SHA256SUMS
          cp Caddyfile install.sh windows/*.ps1 dist/
          (cd windows && zip -q "../dist/zoo-windows-$VERSION.zip" ./*.ps1 README.md)
          (cd dist && sha256sum ./* > SHA256SUMS)
      - run: gh release upload "$TAG" dist/* --clobber

  chart:
    name: Helm chart (OCI)
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      DOCKERHUB: ${{ vars.DOCKERHUB_NAMESPACE || 'chann44' }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      # the chart and the images share the release's version, so `helm install --version X.Y.Z` runs X.Y.Z
      - run: helm package deploy/helm/zoo --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push to Docker Hub as an OCI artifact
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login registry-1.docker.io --username "$USERNAME" --password-stdin
          helm push "dist/zoo-$VERSION.tgz" "oci://registry-1.docker.io/$DOCKERHUB"

  dockerhub-descriptions:
    name: Docker Hub descriptions
    needs: [release-please, images]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { image: api, summary: "Zoo API: FastAPI server, MCP endpoint and sandbox job worker" }
          - { image: web, summary: "Zoo dashboard" }
          - { image: sandbox-desktop, summary: "Zoo desktop and browser sandboxes: Debian, XFCE, Firefox, noVNC" }
          - { image: sandbox-code, summary: "Zoo code sandboxes: Python, Node, git and Claude Code" }
    steps:
      - uses: actions/checkout@v5
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || 'chann44' }}/zoo-${{ matrix.image }}
          short-description: ${{ matrix.summary }}
          readme-filepath: docs/dockerhub/${{ matrix.image }}.md
