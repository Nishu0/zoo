name: Release

# Every push to main publishes edge and sha-<commit> images. release-please keeps a release PR open from the
# conventional commits on main; merging it tags vX.Y.Z, and this workflow then publishes the X.Y.Z images.
# Publishing images is the pipeline's only job: tests, bundles, assets and the chart are done locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.created == 'true' && needs.release-please.outputs.version || '' }}
    secrets: inherit

