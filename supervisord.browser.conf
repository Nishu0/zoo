[supervisord]
nodaemon=true

[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=unix:path=/tmp/zoo-session-bus
priority=5
user=zoo
autorestart=true
environment=HOME="/home/zoo",USER="zoo",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus"

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24 -nolisten tcp -s 0
priority=10
user=zoo
autorestart=true

[program:zoo-guest]
command=/usr/local/bin/zoo-guest
priority=10
user=zoo
autorestart=unexpected
exitcodes=0
environment=HOME="/home/zoo",USER="zoo",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus",GNOME_ACCESSIBILITY="1"

[program:openbox]
command=/usr/bin/openbox --config-file /etc/xdg/openbox/rc.xml
priority=20
user=zoo
autorestart=true
environment=HOME="/home/zoo",USER="zoo",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus"

[program:firefox]
command=/usr/local/bin/browser-start
priority=25
user=zoo
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/home/zoo",USER="zoo",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus",GNOME_ACCESSIBILITY="1"

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbauth /etc/x11vnc.pass -localhost -rfbport 5900
priority=30
user=zoo
autorestart=true
environment=DISPLAY=":1"

[program:zoo-policy]
command=/usr/local/bin/zoo-guest -apps /etc/zoo/apps.json
priority=45
user=root
autorestart=true

[program:earlyoom]
command=/usr/bin/earlyoom -m 5 -s 100
priority=5
user=root
autorestart=true
