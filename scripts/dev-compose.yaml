services:
  gateway:
    image: ${ZOO_REGISTRY}/zoo-gateway:${ZOO_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment: !override
      DATABASE_URL: postgresql://zoo:${POSTGRES_PASSWORD}@postgres:5432/zoo
      JWT_SECRET: ${JWT_SECRET}
      ZOO_SECRETS_KEY: ${ZOO_SECRETS_KEY}
      ZOO_API_URL: ${ZOO_API_URL}
      ZOO_NODE_HOST: ${ZOO_NODE_HOST:-}
      ZOO_NODE_PORT: "7443"
      ZOO_NODE_DIST: /app/node/dist
      ZOO_GATEWAY_PEERS: localhost
      ZOO_GATEWAY_IP: 127.0.0.1
      ZOO_GATEWAY_GRPC_PORT: "7444"
      ZOO_GATEWAY_HTTP_PORT: "8001"
      ZOO_GATEWAY_PEER_HTTP_PORT: "8002"
    depends_on: !override
      postgres:
        condition: service_healthy
    ports: !override ["7443:7443", "127.0.0.1:7444:7444", "127.0.0.1:8001:8001", "127.0.0.1:8002:8002"]
    volumes: !override ["./node/dist:/app/node/dist:ro"]
    healthcheck: !override
      test: ["CMD", "/usr/local/bin/zoo-gateway", "-healthcheck", "http://127.0.0.1:8001/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
  caddy:
    profiles: !reset []
    network_mode: host
    networks: !reset []
    ports: !reset []
    depends_on: !reset []
    volumes: !override ["./scripts/dev.Caddyfile:/etc/caddy/Caddyfile:ro"]
