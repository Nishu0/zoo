[project]
name = "zoo-sdk"
version = "0.2.0"
description = "Python SDK and CLI for Zoo: self-hosted Linux, macOS and Windows sandboxes for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
agent = ["anthropic>=0.70"]
cli = ["typer>=0.12", "websockets>=13"]
claude = ["claude-agent-sdk>=0.1"]
openai = ["openai-agents>=0.2"]
langgraph = ["langchain-core>=0.3"]

[project.scripts]
zoo = "zoo_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/chann44/zoo"
Documentation = "https://github.com/chann44/zoo/tree/main/site/src/content/docs/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoo_sdk"]
