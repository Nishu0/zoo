[supervisord]
nodaemon=true

; one session bus shared by the desktop and the guest, so the guest reaches the apps' accessibility bus
[program:dbus]
command=/usr/bin/dbus-daemon --session --nofork --address=unix:path=/tmp/zoo-session-bus
priority=5
user=zoo
autorestart=true

; Xvfb and zoo-guest start first, together: the guest dials the gateway while the X server comes up
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24
priority=10
user=zoo
autorestart=true
environment=DISPLAY=":1"

[program:zoo-guest]
command=/usr/local/bin/zoo-guest
priority=10
user=zoo
autorestart=unexpected
exitcodes=0
environment=HOME="/home/zoo",USER="zoo",DISPLAY=":1",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus",GNOME_ACCESSIBILITY="1"

; the window manager and panel directly, not startxfce4: no session manager, no session restore
[program:xfwm4]
command=/usr/bin/xfwm4 --replace
priority=20
autorestart=true
user=zoo
environment=DISPLAY=":1",HOME="/home/zoo",USER="zoo",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus",GNOME_ACCESSIBILITY="1"

[program:xfce4-panel]
command=/usr/bin/xfce4-panel
priority=25
autorestart=true
user=zoo
environment=DISPLAY=":1",HOME="/home/zoo",USER="zoo",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/zoo-session-bus",GNOME_ACCESSIBILITY="1"

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbauth /etc/x11vnc.pass -localhost -rfbport 5900
priority=30
user=zoo
autorestart=true
environment=DISPLAY=":1"

; root: enforces the app policy the API writes to /etc/zoo/apps.json, which the zoo user can't touch
[program:zoo-policy]
command=/usr/local/bin/zoo-guest -apps /etc/zoo/apps.json
priority=45
user=root
autorestart=true

; root: kills the largest process before the kernel's OOM killer would freeze the whole sandbox
[program:earlyoom]
command=/usr/bin/earlyoom -m 5 -s 100
priority=5
user=root
autorestart=true
