[project]
name = "zoo"
version = "0.1.6"
description = "Self-hosted sandboxes (Linux, macOS, Windows) for AI agents, driven over MCP, REST and a Python SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "docker>=7.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-psycopg>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "paramiko>=3.5.0",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.53.0",
    "websocket>=0.2.1",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "sqlc-bin>=1.31.1.post1",
    "typer>=0.27.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
markers = [
    "e2e: needs a running Zoo stack (set ZOO_E2E_URL and ZOO_E2E_API_KEY)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
# generated by sqlc and protoc; CI checks they match `sqlc generate` and `make proto` instead
extend-exclude = ["db/generated", "db/async_generated", "server/nodepb", "server/gatewaypb"]

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the framework's idiom
# BLE001: the runtime and reconcile code catch broadly on purpose, to log and carry on
ignore = ["B008", "BLE001"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["server", "db", "mcp_tools", "logger", "utils", "sdk/python", "tests", "main.py"]
extraPaths = ["sdk/python"]
# generated by protoc; typed through its .pyi
exclude = ["server/nodepb", "server/gatewaypb"]

[tool.coverage.run]
source = ["server", "db", "mcp_tools", "utils"]
omit = ["db/generated/*"]
