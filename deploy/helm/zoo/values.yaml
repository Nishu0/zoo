# Zoo on Kubernetes. See site/src/content/docs/docs/guides/kubernetes.md for a walkthrough; the smallest install sets the two hostnames:
#
#   helm install zoo oci://registry-1.docker.io/chann44/zoo --namespace zoo --create-namespace \
#     --set ingress.host=zoo.example.com --set ingress.apiHost=api.zoo.example.com

image:
  registry: docker.io/chann44
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Environment for every Zoo pod (api, worker, gateway): any setting from site/src/content/docs/docs/reference/configuration.md
env: {}
# Environment from existing secrets or config maps, for every Zoo pod (valueFrom/secretRef entries)
envFrom: []

ingress:
  enabled: true
  className: ""
  annotations: {}
  # the dashboard
  host: zoo.example.com
  # the API, which also takes guests from sandboxes outside the cluster (/guest/connect, to the gateway)
  apiHost: api.zoo.example.com
  # e.g. [{secretName: zoo-tls, hosts: [zoo.example.com, api.zoo.example.com]}]; with cert-manager, add its
  # annotation above instead of a secret you made
  tls: []
  # the scheme the public URLs use; https unless you run without TLS
  scheme: https

api:
  replicas: 2
  # uvicorn processes per pod (ZOO_API_WORKERS); match the CPU the pod gets
  workers: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The job worker: sandbox lifecycle jobs and the warm pool (ZOO_ROLE=worker).
worker:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

gateway:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # zoo-node on Macs and Hyper-V hosts dials this, over its own mutual TLS: it
  # can't go through the ingress
  nodes:
    enabled: true
    host: ""
    service:
      type: LoadBalancer
      port: 7443
      annotations: {}
      loadBalancerSourceRanges: []

web:
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # cnpg: a CloudNativePG Cluster this chart creates (the operator must be installed: cloudnative-pg.io).
  # external: any Postgres, such as RDS, Cloud SQL or Azure Database, at a URL in a secret.
  mode: cnpg
  cnpg:
    instances: 2
    # the operator's default image when empty
    imageName: ""
    storage:
      size: 20Gi
      storageClass: ""
    # passed through to the Cluster's spec.backup (barmanObjectStore, retentionPolicy); see CloudNativePG's docs
    backup: {}
    resources: {}
  external:
    # a secret with the database URL, postgresql://user:password@host:5432/zoo?sslmode=require
    existingSecret: ""
    key: url

# Zoo's own secrets: JWT_SECRET signs logins, ZOO_SECRETS_KEY wraps the keys that encrypt stored secrets.
secrets:
  # an existing secret with JWT_SECRET and ZOO_SECRETS_KEY (and anything else from the configuration reference)
  existingSecret: ""
  # without one, the chart generates both once and keeps them across upgrades
  create: true
  # wrap secret keys with a KMS instead of ZOO_SECRETS_KEY: aws:<key ARN>, gcp:projects/.../cryptoKeys/<key> or
  # vault:<mount>/<key>. On EKS and GKE the pods' identity is enough (serviceAccount.annotations).
  kms: ""

# External Secrets Operator (external-secrets.io): the secret above comes from your secret store instead
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  # environment variable: remote reference. Include JWT_SECRET and ZOO_SECRETS_KEY (unless secrets.kms is set),
  # and anything else Zoo should read from the store (DATABASE_URL, AWS keys, ...).
  data:
    JWT_SECRET: {key: zoo/jwt-secret}
    ZOO_SECRETS_KEY: {key: zoo/secrets-key}

# what one sandbox may ask for (server/sizes.py), and the quota each new workspace starts with (server/quotas.py);
# an empty quota is no limit
limits:
  maxSandboxCpus: 8
  maxSandboxMemoryMb: 16384
  maxSandboxDiskGb: 200
  defaultQuota:
    runningSandboxes: ""
    cpus: ""
    memoryMb: ""
    storageGb: ""

# scheduled backups of the database and sandbox homes to object storage (server/backups.py); 0 hours turns them off
backups:
  intervalHours: 24
  keep: 7

# viewer links to embed or share a sandbox's screen (server/viewer_api.py); embedOrigins may frame them (none when
# empty), space-separated
viewer:
  embedOrigins: ""
  maxLinkHours: 24

# events (GET /events, webhooks) are kept this long
retention:
  eventDays: 7

webhooks:
  # let webhooks reach private addresses (a receiver inside the cluster)
  allowPrivate: false

# Object storage, required: app profiles, agent screenshots, home snapshots, backups and moves between hosts live
# there (any S3 API: S3, R2, MinIO, SeaweedFS, GCS's S3 interoperability)
objectStorage:
  # s3://bucket[/prefix]
  url: ""
  # for anything but AWS S3
  endpoint: ""
  region: ""
  # a secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; on EKS the pods' identity can stand in
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  # IAM roles for service accounts (eks.amazonaws.com/role-arn) or GKE Workload Identity
  # (iam.gke.io/gcp-service-account), for KMS and object storage
  annotations: {}

metrics:
  # every Zoo pod serves Prometheus metrics on this port at /metrics
  port: 9464
  serviceMonitor:
    # needs the Prometheus Operator's CRDs
    enabled: false
    interval: 30s
    labels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false

# Linux sandboxes on this cluster: one pod per sandbox with a claim for its home, in their own namespace.
sandboxes:
  enabled: true
  # defaults to <release namespace>-sandboxes
  namespace: ""
  createNamespace: true
  storageClass: zoo-local
  homeSize: 10Gi
  snapshotClass: zoo-snapshots
  idleMemoryMbDesktop: 700
  idleMemoryMbCode: 250
  spareVolumes: 4
  # a stopped sandbox stays paused (resumes instantly) this long, then is deleted down to its volume
  pauseMinutes: 30
  # images; default to the release's desktop, browser, and code images
  images:
    desktop: ""
    browser: ""
    code: ""
  imagePullSecret: ""
  # sandboxes reach the internet and the gateway, nothing else in the cluster
  networkPolicy:
    enabled: true
    # addresses sandboxes never reach: cloud metadata, plus your pod and service CIDRs if your CNI routes
    # cluster traffic outside these rules
    blockedCIDRs:
      - 169.254.169.254/32
      - 169.254.170.2/32
      - fd00:ec2::254/128
  # the egress daemon on every sandbox node: enforces each sandbox's network policy (domains, addresses) outside
  # the sandbox, as on a Docker host. Runs in the host's network namespace with NET_ADMIN.
  egress:
    enabled: true
    nodeSelector: {}
    tolerations: []
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
  prepull:
    enabled: true
    nodeSelector: {}
    tolerations: []
    resources:
      requests: {cpu: 5m, memory: 8Mi}
      limits: {memory: 16Mi}

# Native VM control (vm-control controller, issuer API and node agents). Off by default; enabling it requires
# trustDomain, publicCAConfigMap, issuerTLSSecret, nodeCASecret and runtimeHandler (the patched Kata CLH handler).
vmControl:
  enabled: false
  # trustDomain: zoo.example
  # publicCAConfigMap: zoo-vm-control-ca
  # issuerTLSSecret: zoo-vm-control-issuer-tls
  # nodeCASecret: zoo-vm-control-node-ca
  # runtimeHandler: kata-clh-zoo
  # runtimeSocket: /run/k3s/containerd/containerd.sock
