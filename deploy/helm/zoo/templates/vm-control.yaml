{{- $config := default dict .Values.vmControl -}}
{{- $name := printf "%s-vm-control" (include "zoo.fullname" .) -}}
{{- $namespace := include "zoo.sandboxNamespace" . -}}
{{- $domain := required "vmControl.trustDomain is required for native VM control" (get $config "trustDomain") -}}
{{- $publicCA := required "vmControl.publicCAConfigMap (public node-ca.pem, controller-ca.pem, issuer-ca.pem only) is required" (get $config "publicCAConfigMap") -}}
{{- $issuerName := printf "%s-issuer" $name -}}
{{- $issuer := printf "https://%s.%s.svc.cluster.local:9445/v1/vm-control/certificates" $issuerName .Release.Namespace -}}
{{- $issuerTLS := required "vmControl.issuerTLSSecret (tls.crt/tls.key) is required for the dedicated issuer API" (get $config "issuerTLSSecret") -}}
{{- $nodeSigning := required "vmControl.nodeCASecret (node-ca-key.pem) is required, mounted only in the dedicated issuer API" (get $config "nodeCASecret") -}}
{{- $handler := required "vmControl.runtimeHandler must name the patched Go Kata CLH handler" (get $config "runtimeHandler") -}}
{{- $serverName := printf "%s.%s.svc.cluster.local" $name $namespace -}}
{{- $identities := printf "spiffe://%s/vm-control/controller/api,spiffe://%s/vm-control/controller/worker" $domain $domain -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $issuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zoo.fullname" . }}-{{ .Release.Namespace }}-vm-control-issuer
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zoo.fullname" . }}-{{ .Release.Namespace }}-vm-control-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zoo.fullname" . }}-{{ .Release.Namespace }}-vm-control-issuer
subjects:
  - kind: ServiceAccount
    name: {{ $issuerName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-discovery
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-discovery
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $issuerName }}
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: {{ include "zoo.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $issuerName }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- include "zoo.selector" (list . "vm-control-issuer") | nindent 4 }}
  ports:
    - {name: issuer, port: 9445, targetPort: issuer}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $issuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zoo.selector" (list . "vm-control-issuer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zoo.selector" (list . "vm-control-issuer") | nindent 8 }}
    spec:
      serviceAccountName: {{ $issuerName }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, fsGroup: 10001}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: issuer-api
          image: {{ include "zoo.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/.venv/bin/python, -m, uvicorn]
          args:
            - server.vm_control:issuer_app
            - --factory
            - --host=0.0.0.0
            - --port=9445
            - --ssl-certfile=/issuer-tls/tls.crt
            - --ssl-keyfile=/issuer-tls/tls.key
            - --no-access-log
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: ZOO_RUNTIME, value: kube}
            - {name: ZOO_ROLE, value: api}
            - {name: ZOO_VM_CONTROL_TRUST_DOMAIN, value: {{ $domain | quote }}}
            - {name: ZOO_VM_CONTROL_SERVER_NAME, value: {{ $serverName | quote }}}
            - {name: ZOO_VM_CONTROL_NODE_CA, value: /pki/node-ca.pem}
            - {name: ZOO_VM_CONTROL_NODE_CA_KEY, value: /signing/node-ca-key.pem}
            - {name: ZOO_VM_CONTROL_NAMESPACE, value: {{ $namespace | quote }}}
            - {name: ZOO_VM_CONTROL_SELECTOR, value: {{ printf "app.kubernetes.io/instance=%s,app.kubernetes.io/component=vm-control" .Release.Name | quote }}}
            - {name: ZOO_VM_CONTROL_DAEMONSET, value: {{ $name | quote }}}
            - {name: ZOO_VM_CONTROL_SERVICE_ACCOUNT, value: {{ $name | quote }}}
          ports:
            - {name: issuer, containerPort: 9445}
          readinessProbe:
            tcpSocket: {port: issuer}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: public-ca, mountPath: /pki, readOnly: true}
            - {name: signing, mountPath: /signing, readOnly: true}
            - {name: issuer-tls, mountPath: /issuer-tls, readOnly: true}
      volumes:
        - name: public-ca
          secret:
            secretName: {{ $nodeSigning }}
            defaultMode: 0440
            items:
              - {key: node-ca.pem, path: node-ca.pem}
        - name: signing
          secret:
            secretName: {{ $nodeSigning }}
            defaultMode: 0440
            items:
              - {key: node-ca-key.pem, path: node-ca-key.pem}
        - name: issuer-tls
          secret:
            secretName: {{ $issuerTLS }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $issuerName }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "zoo.selector" (list . "vm-control-issuer") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $namespace }}}
          podSelector:
            matchLabels:
              {{- include "zoo.selector" (list . "vm-control") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 9445}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "zoo.selector" (list . "vm-control") | nindent 4 }}
  ports:
    - name: control
      port: 9444
      targetPort: control
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "zoo.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-control
spec:
  selector:
    matchLabels:
      {{- include "zoo.selector" (list . "vm-control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zoo.selector" (list . "vm-control") | nindent 8 }}
        zoo.dev/vm-control: "true"
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        katacontainers.io/kata-runtime: "true"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: enroll
          image: {{ include "zoo.image" (list . "vm-control") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -mode=enroll
            - -runtime=kube
            - -node-name=$(NODE_NAME)
            - -pod-name=$(POD_NAME)
            - -pod-uid=$(POD_UID)
            - -trust-domain={{ $domain }}
            - -frontend-uid=10001
            - -credential-dir=/run/zoo-vm-control/credentials
            - -enroll-url={{ $issuer }}
            - -enroll-ca=/pki/issuer-ca.pem
            - -node-ca=/pki/node-ca.pem
            - -enroll-token=/enrollment/token
            - -server-name={{ $serverName }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: private, mountPath: /run/zoo-vm-control}
            - {name: public-ca, mountPath: /pki, readOnly: true}
            - {name: enrollment, mountPath: /enrollment, readOnly: true}
      containers:
        - name: broker
          image: {{ include "zoo.image" (list . "vm-control") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -mode=broker
            - -node-name=$(NODE_NAME)
            - -pod-name=$(POD_NAME)
            - -pod-uid=$(POD_UID)
            - -trust-domain={{ $domain }}
            - -controllers={{ $identities }}
            - -frontend-uid=10001
            - -credential-dir=/run/zoo-vm-control/credentials
            - -broker-socket=/run/zoo-vm-control/broker/broker.sock
            - -runtime=kube
            - -runtime-socket=/runtime/containerd.sock
            - -namespace={{ $namespace }}
            - -runtime-handler={{ $handler }}
            - -shim-root=/run/vc/sbs
            - -host-memory=/host/proc/meminfo
            - -enroll-url={{ $issuer }}
            - -enroll-ca=/pki/issuer-ca.pem
            - -node-ca=/pki/node-ca.pem
            - -enroll-token=/enrollment/token
            - -server-name={{ $serverName }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: private, mountPath: /run/zoo-vm-control}
            - {name: public-ca, mountPath: /pki, readOnly: true}
            - {name: enrollment, mountPath: /enrollment, readOnly: true}
            - {name: runtime, mountPath: /runtime/containerd.sock, readOnly: true}
            - {name: shim, mountPath: /run/vc/sbs, readOnly: true}
            - {name: shim-manifest, mountPath: /opt/kata/share/zoo-vm-control/manifest.json, readOnly: true}
            - {name: shim-binary, mountPath: /opt/kata/bin/containerd-shim-kata-v2, readOnly: true}
            - {name: host-memory, mountPath: /host/proc/meminfo, readOnly: true}
        - name: frontend
          image: {{ include "zoo.image" (list . "vm-control") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -mode=frontend
            - -node-name=$(NODE_NAME)
            - -trust-domain={{ $domain }}
            - -controllers={{ $identities }}
            - -credential-dir=/run/zoo-vm-control/credentials
            - -broker-socket=/run/zoo-vm-control/broker/broker.sock
            - -controller-ca=/pki/controller-ca.pem
            - -listen=:9444
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: control, containerPort: 9444}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/zoo-vm-control
                - -mode=credentials-check
                - -trust-domain={{ $domain }}
                - -controllers={{ $identities }}
                - -credential-dir=/run/zoo-vm-control/credentials
                - -broker-socket=/run/zoo-vm-control/broker/broker.sock
                - -controller-ca=/pki/controller-ca.pem
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: private, mountPath: /run/zoo-vm-control, readOnly: true}
            - {name: public-ca, mountPath: /pki, readOnly: true}
      volumes:
        - name: private
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: public-ca
          configMap:
            name: {{ $publicCA }}
            items:
              - {key: node-ca.pem, path: node-ca.pem}
              - {key: controller-ca.pem, path: controller-ca.pem}
              - {key: issuer-ca.pem, path: issuer-ca.pem}
        - name: enrollment
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: zoo-vm-control-enroll
                  expirationSeconds: 600
                  path: token
        - name: runtime
          hostPath:
            path: {{ default "/run/k3s/containerd/containerd.sock" (get $config "runtimeSocket") }}
            type: Socket
        - name: shim
          hostPath: {path: /run/vc/sbs, type: Directory}
        - name: shim-manifest
          hostPath: {path: /opt/kata/share/zoo-vm-control/manifest.json, type: File}
        - name: shim-binary
          hostPath: {path: /opt/kata/bin/containerd-shim-kata-v2, type: File}
        - name: host-memory
          hostPath: {path: /proc/meminfo, type: File}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "zoo.selector" (list . "vm-control") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [api, worker]}
      ports:
        - {protocol: TCP, port: 9444}
