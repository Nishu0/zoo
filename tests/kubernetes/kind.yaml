# What the Helm chart and a Kata cluster provide, for kind. kind's containerd runs plain runc; this RuntimeClass gives
# it the name the driver asks for, so the driver's tests run as they would under Kata.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: runc
---
# deploy/helm/zoo/templates/priority.yaml
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: zoo-sandbox
value: 1000000000
globalDefault: false
description: Zoo sandbox virtual machines.
